name: Ubuntu

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  BUILD_TYPE: release
  INSTALL_LOCATION: .local

jobs:
  build:

    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - name: Get CMake and Ninja
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: "~4.1.0"

    - uses: actions/checkout@v4
      
    - name: cache dependencies
      uses: actions/cache@v4
      id: cache
      with:
        path: ${{ github.workspace }}/${{ env.INSTALL_LOCATION }}
        key: ${{ runner.os }}-dependencies-${{ hashFiles('CMakeLists.txt') }}

#    - name: install GCC latest
#      run: |
#        apt-get update -y
#        apt-get install -y build-essential wget
#        wget --quiet https://kayari.org/gcc-latest/gcc-latest.deb
#        dpkg -i gcc-latest.deb

    - name: configure
      run: cmake --preset $BUILD_TYPE -DCMAKE_INSTALL_PREFIX=$GITHUB_WORKSPACE/$INSTALL_LOCATION -DProject_ENABLE_CODE_COVERAGE=1
      
    - name: build
      run: cmake --build --preset $BUILD_TYPE -j4

    - name: run tests
      run: |
        ctest --preset $BUILD_TYPE -VV

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        fail_ci_if_error: false

    - name: install project
      run: cmake --build build --target install --preset release

